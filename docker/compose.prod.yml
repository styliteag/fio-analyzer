# Production Docker Compose using pre-built images from registry
# Usage: docker compose -f compose.prod.yml up -d

services:
  app:
    container_name: fio-app
    image: docker.io/styliteag/fio-analyzer-app:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:80:80"  # Put an HTTPS reverse proxy in front for remote access
    environment:
      # Frontend and API share one origin here: no cross-origin callers with the session cookie
      CORS_ORIGINS: ""
      # auto = Secure cookie when the HTTPS proxy sends X-Forwarded-Proto: https.
      # Set "true" behind HTTPS if the proxy does not send that header.
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-48}
    volumes:      
      - ./data/backend/db:/app/db
      - ./data/backend/uploads:/app/uploads
      - ./data/auth/.htpasswd:/app/.htpasswd
      - ./data/auth/.htuploaders:/app/.htuploaders
      - ./data/auth/.htviewers:/app/.htviewers  # create first: touch data/auth/.htviewers
    networks:
      - fio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/health-check.sh"]
      timeout: 60s
      interval: 30s
      retries: 3

networks:
  fio-network:
    driver: bridge
