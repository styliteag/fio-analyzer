events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Log to stderr for container logging
    error_log /dev/stderr;
    access_log /dev/stdout;

    # Keep the scheme of the outer HTTPS reverse proxy: the backend sets the session
    # cookie's Secure flag from it (this nginx itself only speaks HTTP)
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }
    
    server {
        listen 80;
        server_name localhost;
        client_max_body_size 52m; # 50 MiB JSON file plus multipart form overhead
        root /usr/share/nginx/html;
        index index.html;

        # Frontend static files (React SPA)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API documentation
        location /api-docs {
            proxy_pass http://localhost:8000/api-docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location /api-docs/ {
            proxy_pass http://localhost:8000/api-docs/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Backend API proxy
        location /api/ {
            proxy_pass http://localhost:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
